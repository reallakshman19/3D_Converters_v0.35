name: XML-CII2019 Roundtrip Foundation R1
on:
  push:
    branches:
      - 'feature/xml-cii2019-roundtrip-foundation-r1-*'
    paths:
      - 'roundtrip_foundation/**'
      - 'tests/test_roundtrip_foundation.py'
      - '.github/workflows/xml-cii2019-roundtrip-foundation-r1.yml'
  pull_request:
    paths:
      - 'roundtrip_foundation/**'
      - 'tests/test_roundtrip_foundation.py'
      - '.github/workflows/xml-cii2019-roundtrip-foundation-r1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-lineage:
    name: Native converter replay and read-only lineage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile foundation and test code
        run: |
          python3 -m py_compile roundtrip_foundation/snapshot_replay.py roundtrip_foundation/lineage.py tests/test_roundtrip_foundation.py
      - name: Run real-converter replay and lineage tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_roundtrip_foundation.py' -v 2>&1 | tee "$RUNNER_TEMP/roundtrip-unittests.txt"
      - name: Preserve native test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-cii-roundtrip-foundation-native-tests
          path: ${{ runner.temp }}/roundtrip-unittests.txt
          if-no-files-found: warn
